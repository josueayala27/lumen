[package]
name = "lumen-output"
version = "0.0.1"
edition = "2021"

[dependencies]
lumen-render = { path = "../lumen-render" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["unstable"] }

[dev-dependencies]
lumen-media = { path = "../lumen-media" }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
