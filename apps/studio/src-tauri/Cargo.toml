[package]
name = "lumen-desktop"
version = "0.0.1"
description = "Lumen live presentation studio"
edition = "2021"
rust-version = "1.85"

[lib]
name = "lumen_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
lumen-control = { path = "crates/lumen-control" }
lumen-media = { path = "crates/lumen-media" }
lumen-output = { path = "crates/lumen-output" }
lumen-render = { path = "crates/lumen-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"

[workspace]
members = [".", "crates/lumen-output", "crates/lumen-render", "crates/lumen-media", "crates/lumen-control"]
resolver = "2"
